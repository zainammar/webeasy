{% extends 'themeOne/base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}

<!-- Product Page -->
<div class="row-2 content-grid  bg-black text-white">
    
    <div class="grid-item-1  bg-blue ">
        <h1 class="text-1">{{ product.name }}</h1>
        <img src="{{ product.image.url }}" width="200">
        <p class="text-2">{{ product.description }}</p>
      
    </div>

    <div class="grid-item-1">
        <p class="text-2">Price: PKR{{ product.price }}</p>
        <form action="{% url 'shop:add_to_cart' product.slug %}" method="post">
            {% csrf_token %}
            <label class="text-2">Quantity:</label>
            <input type="number" name="quantity" value="1" min="1">
            <button  type="submit">Add to Cart</button>
        </form>
    </div>

</div>
  



{% endblock %}
